version: '3.8'

services:
  vault:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    container_name: vault
    ports:
      - "${VAULT_PORT:-8002}:${VAULT_PORT:-8002}"
    volumes:
      # Watch directory - mount your documents here to be indexed
      - ${VAULT_WATCH_DIR:-./watch}:/watch
      # Vault storage - where LanceDB and Whoosh indices are stored
      - ${VAULT_PATH:-./vault}:/vault
    env_file:
      - .env
    environment:
      - PYTHONUNBUFFERED=1
      - VAULT_PATH=/vault
      - VAULT_WATCH_DIR=/watch
      - VAULT_HOST=${VAULT_HOST:-0.0.0.0}
      - VAULT_PORT=${VAULT_PORT:-8002}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import talkpipe_vault; print('OK')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    extra_hosts:  # <--- ADD THIS
      - "host.containers.internal:host-gateway"
    networks:
      - vault-network

  # Development service for local development
  vault-dev:
    build:
      context: .
      dockerfile: Dockerfile
      target: builder
    container_name: vault-dev
    ports:
      - "${VAULT_PORT:-8002}:${VAULT_PORT:-8002}"
    volumes:
      - .:/app
      - vault_dev_cache:/home/builder/.cache
      - ${VAULT_WATCH_DIR:-./watch}:/watch
      - ${VAULT_PATH:-./vault}:/vault
    environment:
      - PYTHONUNBUFFERED=1
      - VAULT_PATH=/vault
      - VAULT_WATCH_DIR=/watch
      - VAULT_HOST=${VAULT_HOST:-0.0.0.0}
      - VAULT_PORT=${VAULT_PORT:-8002}
    working_dir: /app
    command: ["python", "-m", "uvicorn", "src.talkpipe_vault.apps.query:app", "--host", "0.0.0.0", "--port", "8002", "--reload"]
    extra_hosts:  # <--- ADD THIS
      - "host.containers.internal:host-gateway"
    networks:
      - vault-network
    profiles:
      - dev

volumes:
  # Build cache for development
  vault_dev_cache:
    driver: local

networks:
  vault-network:
    driver: bridge