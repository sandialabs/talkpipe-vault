# Works with Docker Compose and Podman. For Podman, install a compose provider
# (e.g. `pip install podman-compose`) and run `podman compose up`.
services:
  vault:
    build:
      context: .
      dockerfile: Containerfile
    image: ${IMAGE_NAME:-talkpipe-vault}
    container_name: talkpipe-vault
    ports:
      - "${VAULT_PORT:-8002}:8002"
    volumes:
      - talkpipe_vault_data:/app/data
      # Host documents to index, visible in the folder picker at /documents.
      # Required, and must be an absolute path that exists: compose providers
      # do not expand "~" in a volume mapping, so a default of ~/Documents
      # silently mounted a literal "~" directory under Docker Compose. Better
      # to fail with the message above than to come up with nothing to index.
      # On SELinux hosts (e.g. Fedora) append :z, e.g. ".../documents:ro,z".
      - ${VAULT_DOCUMENTS_DIR:?Set VAULT_DOCUMENTS_DIR in .env to the absolute path of the documents folder to mount}:/documents:ro
    environment:
      # The vault to open is not set here: the image's CMD is
      # `vault-server --resume`, which reopens the vault last used in the web
      # interface and otherwise starts on the Vaults & Documents page. The
      # server's host and port are fixed by that CMD too; VAULT_PORT below
      # only chooses the published host port.
      # Persist web-interface settings (recent vaults, model choices) in the data volume
      - TALKPIPE_VAULT_HOME=/app/data/vault-home
      # Used only when a selected source is ollama (the default chat
      # setting). Other providers need no line here — choose the provider and
      # enter its API key on the Settings page (saved in the data volume) —
      # but can be configured from the environment by adding them here, e.g.
      # - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - TALKPIPE_OLLAMA_SERVER_URL=${TALKPIPE_OLLAMA_SERVER_URL:-http://host.containers.internal:11434}
      # Hugging Face offline mode. Leave unset for auto-detection: the
      # entrypoint probes huggingface.co at startup and switches to offline
      # (cache-only) model loads when it is unreachable. The model downloads
      # once, into the data volume. Set 1 in .env to force offline, 0 to
      # force online (see .env.example).
      - HF_HUB_OFFLINE=${HF_HUB_OFFLINE:-}
      # Path fences (defaults baked into the image); override in .env to
      # relax (empty = unrestricted) or move them.
      - TALKPIPE_VAULT_ROOT=${TALKPIPE_VAULT_ROOT-/app/data}
      - TALKPIPE_DOCUMENT_ROOTS=${TALKPIPE_DOCUMENT_ROOTS-/documents}
      - PYTHONUNBUFFERED=1
    restart: unless-stopped
    healthcheck:
      # Ask the running server, not the interpreter: importing the package
      # succeeds even when the web application never came up or has wedged,
      # which made this check unable to fail and `restart: unless-stopped`
      # unable to help. /api/health needs no vault and no authentication.
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8002/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s
    extra_hosts:
      - "host.containers.internal:host-gateway"
    networks:
      - talkpipe-vault-network

  vault-dev:
    build:
      context: .
      dockerfile: Containerfile
    image: ${IMAGE_NAME:-talkpipe-vault}:dev
    container_name: talkpipe-vault-dev
    ports:
      - "${VAULT_PORT:-8002}:8002"
    volumes:
      - .:/workspace:Z
      - talkpipe_vault_dev_data:/app/data
      - talkpipe_vault_dev_cache:/home/vault/.cache
      - ${VAULT_DOCUMENTS_DIR:?Set VAULT_DOCUMENTS_DIR in .env to the absolute path of the documents folder to mount}:/documents:ro
    environment:
      # Unlike the `vault` service, this one overrides the command below and
      # does pass these to vault-server.
      - VAULT_HOST=0.0.0.0
      - VAULT_PORT=8002
      # Persist web-interface settings (recent vaults, model choices) in the data volume
      - TALKPIPE_VAULT_HOME=/app/data/vault-home
      - TALKPIPE_OLLAMA_SERVER_URL=${TALKPIPE_OLLAMA_SERVER_URL:-http://host.containers.internal:11434}
      # No auto-detection here: vault-dev overrides the entrypoint, so set
      # HF_HUB_OFFLINE explicitly in .env when huggingface.co is unreachable.
      - HF_HUB_OFFLINE=${HF_HUB_OFFLINE:-}
      - TALKPIPE_VAULT_ROOT=${TALKPIPE_VAULT_ROOT-/app/data}
      - TALKPIPE_DOCUMENT_ROOTS=${TALKPIPE_DOCUMENT_ROOTS-/documents}
      - PYTHONUNBUFFERED=1
    working_dir: /workspace
    entrypoint: ["/bin/bash", "-lc"]
    # Single-element list so the whole script reaches `bash -lc` as one argument
    # (a plain string would be word-split by compose).
    command:
      - >-
        python3 -m pip install --user -e '.[dev]' &&
        vault-server --resume --host "$${VAULT_HOST}" --port "$${VAULT_PORT}" --no-browser
    extra_hosts:
      - "host.containers.internal:host-gateway"
    networks:
      - talkpipe-vault-network
    profiles:
      - dev

volumes:
  talkpipe_vault_data:
    driver: local
  talkpipe_vault_dev_data:
    driver: local
  talkpipe_vault_dev_cache:
    driver: local

networks:
  talkpipe-vault-network:
    driver: bridge
