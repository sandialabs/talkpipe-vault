<style>
    .results-header {
        align-items: center;
        display: flex;
        gap: 16px;
        justify-content: space-between;
        margin-bottom: 15px;
    }
    .results-count {
        color: #475569;
        font-weight: 650;
    }
    .results-note {
        color: #64748b;
        font-size: 0.88rem;
        margin-top: 2px;
    }
    .result-card-header {
        align-items: flex-start;
        display: flex;
        gap: 12px;
        justify-content: space-between;
        margin-bottom: 6px;
    }
    .copy-results-btn,
    .copy-snippet-btn {
        background: var(--field-bg);
        border: 1px solid var(--field-border);
        border-radius: 999px;
        color: #666;
        cursor: pointer;
        font-size: 0.85rem;
        padding: 8px 14px;
        transition: background 0.2s, color 0.2s;
        white-space: nowrap;
    }
    .copy-snippet-btn {
        font-size: 0.78rem;
        padding: 6px 10px;
    }
    .copy-results-btn:hover,
    .copy-snippet-btn:hover {
        background: #e2e4e6;
        color: #333;
    }
    .copy-results-btn.copied,
    .copy-snippet-btn.copied {
        background: var(--success);
        border-color: var(--success);
        color: white;
    }
    .result-title-link {
        background: transparent;
        border: 0;
        color: var(--primary-dark);
        cursor: pointer;
        font: inherit;
        font-weight: 700;
        padding: 0;
        text-align: left;
    }
    .result-title-link:hover,
    .result-title-link:focus {
        text-decoration: underline;
    }
    .search-loading {
        align-items: center;
        color: #666;
        display: flex;
        font-size: 1.1rem;
        gap: 12px;
        justify-content: center;
        padding: 40px;
    }
    .search-loading .spinner {
        animation: spin 0.8s linear infinite;
        border: 3px solid #ddd;
        border-radius: 50%;
        border-top-color: var(--primary);
        height: 24px;
        width: 24px;
    }
    .empty-suggestions {
        color: #64748b;
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        justify-content: center;
        margin-top: 14px;
    }
    .empty-suggestions span {
        background: #f8fafc;
        border: 1px solid #e2e8f0;
        border-radius: 999px;
        padding: 6px 10px;
    }
    @keyframes spin {
        to { transform: rotate(360deg); }
    }
    #search-btn:disabled {
        cursor: not-allowed;
        opacity: 0.6;
    }
</style>

<script>
document.addEventListener('DOMContentLoaded', function() {
    const form = document.getElementById('search-form');
    const input = document.getElementById('search-input');
    const btn = document.getElementById('search-btn');
    const loading = document.getElementById('loading-overlay');
    const copyBtn = document.getElementById('copy-results-btn');
    const resultsRoot = document.getElementById('search-results');

    function setCopied(button, ok) {
        const original = button.textContent;
        button.textContent = ok ? 'Copied' : 'Copy failed';
        if (ok) {
            button.classList.add('copied');
        }
        setTimeout(function() {
            button.textContent = original;
            button.classList.remove('copied');
        }, 2000);
    }

    function escapeRegExp(value) {
        return value.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
    }

    // Common words (and the boolean operators AND/OR/NOT) that would light up
    // in nearly every snippet; highlighting them is noise, not signal.
    // Quoted phrases are always highlighted verbatim.
    const HIGHLIGHT_STOPWORDS = new Set([
        'and', 'or', 'not', 'the', 'for', 'are', 'was', 'were', 'with',
        'that', 'this', 'from', 'have', 'has', 'had', 'can', 'could',
        'will', 'would', 'into', 'onto', 'when', 'where', 'which', 'what',
        'how', 'who', 'whom', 'why', 'does', 'did', 'you', 'your', 'they',
        'them', 'their', 'its', 'about', 'than', 'then', 'there', 'here',
        'been', 'being', 'but', 'all', 'any', 'each', 'other', 'some',
        'such', 'only', 'own', 'same', 'more', 'most', 'very', 'just'
    ]);

    function highlightSnippetTerms() {
        if (!resultsRoot) {
            return;
        }
        const query = resultsRoot.getAttribute('data-query') || '';
        const terms = query.match(/"([^"]+)"|\b[\w-]{3,}\b/g);
        if (!terms) {
            return;
        }
        const normalizedTerms = terms.map(function(term) {
            const isPhrase = term.charAt(0) === '"';
            return { text: term.replace(/^"|"$/g, ''), isPhrase: isPhrase };
        }).filter(function(term) {
            if (!term.text) {
                return false;
            }
            return term.isPhrase || !HIGHLIGHT_STOPWORDS.has(term.text.toLowerCase());
        }).map(function(term) {
            return term.text;
        });
        if (!normalizedTerms.length) {
            return;
        }
        const pattern = new RegExp('(' + normalizedTerms.map(escapeRegExp).join('|') + ')', 'gi');
        document.querySelectorAll('.snippet').forEach(function(snippet) {
            const text = snippet.textContent;
            snippet.innerHTML = text.replace(pattern, '<mark>$1</mark>');
        });
    }

    if (form) {
        form.addEventListener('submit', function(e) {
            if (btn.disabled || !input.value.trim()) {
                e.preventDefault();
                return;
            }
            btn.disabled = true;
            btn.textContent = 'Searching...';
            loading.style.display = 'flex';
        });
    }

    if (copyBtn) {
        copyBtn.addEventListener('click', function() {
            const resultCards = document.querySelectorAll('.result-card');
            let text = '';

            resultCards.forEach(function(card, index) {
                const title = card.querySelector('.result-title-link').textContent;
                const pathLink = card.querySelector('.path a');
                const snippet = card.querySelector('.snippet').textContent;
                const scoreEl = card.querySelector('.score');

                text += (index + 1) + '. ' + title + '\n';
                if (pathLink) {
                    text += '   Path: ' + pathLink.textContent + '\n';
                }
                if (scoreEl) {
                    text += '   ' + scoreEl.textContent + '\n';
                }
                text += '   ' + snippet + '\n\n';
            });

            copyTextToClipboard(text.trim()).then(function(ok) {
                setCopied(copyBtn, ok);
            });
        });
    }

    document.querySelectorAll('.copy-snippet-btn').forEach(function(button) {
        button.addEventListener('click', async function() {
            const path = button.getAttribute('data-path');
            const snippet = button.getAttribute('data-snippet') || '';

            let content = '';
            try {
                content = await fetchChunkContent(path, snippet);
            } catch (err) {
                content = '';
            }
            const ok = await copyTextToClipboard(content || snippet);
            setCopied(button, ok);
        });
    });

    document.querySelectorAll('.result-title-link').forEach(function(link) {
        link.addEventListener('click', function() {
            const path = link.getAttribute('data-path');
            const snippet = link.getAttribute('data-snippet') || '';
            openDocumentModal(path, snippet, link, link.textContent.trim());
        });
    });

    highlightSnippetTerms();
});
</script>
