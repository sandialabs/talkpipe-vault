<style>
    .results-header {
        align-items: center;
        display: flex;
        gap: 16px;
        justify-content: space-between;
        margin-bottom: 15px;
    }
    .results-count {
        color: #475569;
        font-weight: 650;
    }
    .results-note {
        color: #64748b;
        font-size: 0.88rem;
        margin-top: 2px;
    }
    .result-card-header {
        align-items: flex-start;
        display: flex;
        gap: 12px;
        justify-content: space-between;
        margin-bottom: 6px;
    }
    .copy-results-btn,
    .copy-snippet-btn {
        background: #f1f3f4;
        border: 1px solid #ddd;
        border-radius: 999px;
        color: #666;
        cursor: pointer;
        font-size: 0.85rem;
        padding: 8px 14px;
        transition: background 0.2s, color 0.2s;
        white-space: nowrap;
    }
    .copy-snippet-btn {
        font-size: 0.78rem;
        padding: 6px 10px;
    }
    .copy-results-btn:hover,
    .copy-snippet-btn:hover {
        background: #e2e4e6;
        color: #333;
    }
    .copy-results-btn.copied,
    .copy-snippet-btn.copied {
        background: #34a853;
        border-color: #34a853;
        color: white;
    }
    .result-title-link {
        background: transparent;
        border: 0;
        color: #1a0dab;
        cursor: pointer;
        font: inherit;
        font-weight: 700;
        padding: 0;
        text-align: left;
    }
    .result-title-link:hover,
    .result-title-link:focus {
        text-decoration: underline;
    }
    .document-modal {
        align-items: center;
        background: rgba(0, 0, 0, 0.55);
        bottom: 0;
        display: flex;
        justify-content: center;
        left: 0;
        position: fixed;
        right: 0;
        top: 0;
        z-index: 9999;
    }
    .document-modal-content {
        background: #fff;
        border-radius: 12px;
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.25);
        display: flex;
        flex-direction: column;
        max-height: 80vh;
        max-width: 920px;
        width: 92%;
    }
    .document-modal-header {
        align-items: center;
        border-bottom: 1px solid #ddd;
        display: flex;
        justify-content: space-between;
        padding: 12px 16px;
    }
    #document-modal-title {
        font-size: 1rem;
        margin: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
    }
    #document-modal-close {
        background: transparent;
        border: none;
        cursor: pointer;
        font-size: 1.35rem;
        line-height: 1;
        padding: 4px 8px;
    }
    #document-modal-body {
        margin: 0;
        overflow: auto;
        padding: 16px;
        white-space: pre-wrap;
        word-break: break-word;
    }
    .search-loading {
        align-items: center;
        color: #666;
        display: flex;
        font-size: 1.1rem;
        gap: 12px;
        justify-content: center;
        padding: 40px;
    }
    .search-loading .spinner {
        animation: spin 0.8s linear infinite;
        border: 3px solid #ddd;
        border-radius: 50%;
        border-top-color: #667eea;
        height: 24px;
        width: 24px;
    }
    .empty-suggestions {
        color: #64748b;
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        justify-content: center;
        margin-top: 14px;
    }
    .empty-suggestions span {
        background: #f8fafc;
        border: 1px solid #e2e8f0;
        border-radius: 999px;
        padding: 6px 10px;
    }
    @keyframes spin {
        to { transform: rotate(360deg); }
    }
    #search-btn:disabled {
        cursor: not-allowed;
        opacity: 0.6;
    }
</style>

<script>
document.addEventListener('DOMContentLoaded', function() {
    const form = document.getElementById('search-form');
    const input = document.getElementById('search-input');
    const btn = document.getElementById('search-btn');
    const loading = document.getElementById('loading-overlay');
    const copyBtn = document.getElementById('copy-results-btn');
    const modal = document.getElementById('document-modal');
    const modalTitle = document.getElementById('document-modal-title');
    const modalBody = document.getElementById('document-modal-body');
    const modalClose = document.getElementById('document-modal-close');
    const resultsRoot = document.getElementById('search-results');
    let lastFocusedElement = null;

    function setCopied(button, label) {
        const original = button.textContent;
        button.textContent = label;
        button.classList.add('copied');
        setTimeout(function() {
            button.textContent = original;
            button.classList.remove('copied');
        }, 2000);
    }

    function escapeRegExp(value) {
        return value.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
    }

    function highlightSnippetTerms() {
        if (!resultsRoot) {
            return;
        }
        const query = resultsRoot.getAttribute('data-query') || '';
        const terms = query.match(/"([^"]+)"|\b[\w-]{3,}\b/g);
        if (!terms) {
            return;
        }
        const normalizedTerms = terms.map(function(term) {
            return term.replace(/^"|"$/g, '');
        }).filter(Boolean);
        if (!normalizedTerms.length) {
            return;
        }
        const pattern = new RegExp('(' + normalizedTerms.map(escapeRegExp).join('|') + ')', 'gi');
        document.querySelectorAll('.snippet').forEach(function(snippet) {
            const text = snippet.textContent;
            snippet.innerHTML = text.replace(pattern, '<mark>$1</mark>');
        });
    }

    function closeModal() {
        if (!modal) {
            return;
        }
        modal.style.display = 'none';
        if (lastFocusedElement) {
            lastFocusedElement.focus();
        }
    }

    if (form) {
        form.addEventListener('submit', function(e) {
            if (btn.disabled || !input.value.trim()) {
                e.preventDefault();
                return;
            }
            btn.disabled = true;
            btn.textContent = 'Searching...';
            loading.style.display = 'flex';
        });
    }

    if (copyBtn) {
        copyBtn.addEventListener('click', function() {
            const resultCards = document.querySelectorAll('.result-card');
            let text = '';

            resultCards.forEach(function(card, index) {
                const title = card.querySelector('.result-title-link').textContent;
                const pathLink = card.querySelector('.path a');
                const snippet = card.querySelector('.snippet').textContent;
                const score = card.querySelector('.score').textContent;

                text += (index + 1) + '. ' + title + '\n';
                if (pathLink) {
                    text += '   Path: ' + pathLink.textContent + '\n';
                }
                text += '   ' + score + '\n';
                text += '   ' + snippet + '\n\n';
            });

            navigator.clipboard.writeText(text.trim()).then(function() {
                setCopied(copyBtn, 'Copied');
            });
        });
    }

    document.querySelectorAll('.copy-snippet-btn').forEach(function(button) {
        button.addEventListener('click', function() {
            navigator.clipboard.writeText(button.getAttribute('data-snippet') || '').then(function() {
                setCopied(button, 'Copied');
            });
        });
    });

    document.querySelectorAll('.result-title-link').forEach(function(link) {
        link.addEventListener('click', async function() {
            const path = link.getAttribute('data-path');
            const snippet = link.getAttribute('data-snippet') || '';
            if (!path) {
                return;
            }

            lastFocusedElement = link;
            modal.style.display = 'flex';
            modalTitle.textContent = path;
            modalBody.textContent = 'Loading full text...';
            modalClose.focus();

            try {
                const response = await fetch('/chunk-content?path=' + encodeURIComponent(path) + '&snippet=' + encodeURIComponent(snippet));
                const payload = await response.json();
                if (!response.ok) {
                    modalBody.textContent = payload.error || 'Failed to load document content.';
                    return;
                }
                modalBody.textContent = payload.content || '(No content)';
            } catch (err) {
                modalBody.textContent = 'Failed to load document content.';
            }
        });
    });

    if (modalClose) {
        modalClose.addEventListener('click', closeModal);
    }

    if (modal) {
        modal.addEventListener('click', function(e) {
            if (e.target === modal) {
                closeModal();
            }
        });
    }

    document.addEventListener('keydown', function(e) {
        if (e.key === 'Escape' && modal && modal.style.display !== 'none') {
            closeModal();
        }
    });

    highlightSnippetTerms();
});
</script>
