<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Talkpipe Vault{% endblock %}</title>
    <style>
        :root {
            --bg: #f6f7fb;
            --panel: #ffffff;
            --panel-border: rgba(30, 41, 59, 0.08);
            --text: #1f2937;
            --muted: #64748b;
            --primary: #5b6ee1;
            --primary-dark: #3f4eb8;
            --accent: #8b5cf6;
            --success: #16a34a;
            --shadow-sm: 0 8px 24px rgba(15, 23, 42, 0.06);
            --shadow-md: 0 18px 45px rgba(15, 23, 42, 0.12);
            --radius: 16px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background:
                radial-gradient(circle at top left, rgba(91, 110, 225, 0.12), transparent 34rem),
                radial-gradient(circle at top right, rgba(139, 92, 246, 0.10), transparent 30rem),
                var(--bg);
            color: var(--text);
            line-height: 1.6;
            min-height: 100vh;
        }

        .container {
            max-width: 1040px;
            margin: 0 auto;
            padding: 24px;
        }

        .container-full {
            max-width: none;
        }

        header {
            background:
                linear-gradient(135deg, rgba(24, 32, 79, 0.95) 0%, rgba(75, 55, 158, 0.95) 100%),
                linear-gradient(135deg, var(--primary) 0%, var(--accent) 100%);
            color: white;
            margin-bottom: 28px;
            overflow: hidden;
            position: relative;
            box-shadow: var(--shadow-md);
        }

        header::before {
            background: radial-gradient(circle, rgba(255, 255, 255, 0.18), transparent 68%);
            content: "";
            height: 260px;
            position: absolute;
            right: -70px;
            top: -105px;
            width: 260px;
        }

        header::after {
            background: rgba(255, 255, 255, 0.08);
            bottom: -70px;
            content: "";
            height: 150px;
            left: 10%;
            position: absolute;
            transform: rotate(-12deg);
            width: 420px;
        }

        header .container {
            display: grid;
            grid-template-columns: minmax(0, 1fr) auto;
            align-items: center;
            gap: 28px;
            padding-bottom: 28px;
            padding-top: 28px;
            position: relative;
            z-index: 1;
        }

        header h1 {
            font-size: 1.85rem;
            font-weight: 750;
            letter-spacing: -0.03em;
            line-height: 1.1;
        }

        .header-brand {
            display: flex;
            align-items: center;
            gap: 16px;
            margin-bottom: 16px;
        }

        .header-logo {
            background: rgba(255, 255, 255, 0.95);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.18);
            height: 56px;
            width: auto;
            border-radius: 14px;
            padding: 4px;
        }

        .header-subtitle {
            color: rgba(255, 255, 255, 0.78);
            font-size: 0.98rem;
            margin-top: 5px;
        }

        header nav {
            align-items: center;
            background: rgba(255, 255, 255, 0.12);
            border: 1px solid rgba(255, 255, 255, 0.18);
            border-radius: 999px;
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(12px);
            display: flex;
            gap: 4px;
            padding: 6px;
        }

        header nav a {
            color: white;
            text-decoration: none;
            padding: 9px 15px;
            border-radius: 999px;
            transition: all 0.2s;
            font-size: 0.9rem;
            font-weight: 650;
            white-space: nowrap;
        }

        header nav a:hover {
            background: rgba(255,255,255,0.16);
            transform: translateY(-1px);
        }

        header nav a.active {
            background: white;
            color: #4338ca;
            font-weight: 750;
            box-shadow: 0 8px 20px rgba(15, 23, 42, 0.14);
        }

        header nav form {
            margin: 0;
        }

        header nav button {
            background: rgba(255, 255, 255, 0.12);
            border: none;
            border-radius: 999px;
            color: white;
            cursor: pointer;
            font-size: 0.9rem;
            font-weight: 650;
            padding: 9px 15px;
            transition: all 0.2s;
            white-space: nowrap;
        }

        header nav button:hover {
            background: rgba(255,255,255,0.16);
            transform: translateY(-1px);
        }

        .vault-info {
            font-size: 0.85rem;
            color: rgba(255,255,255,0.8);
            margin-top: 5px;
        }

        .vault-stats {
            display: flex;
            gap: 10px;
            font-size: 0.85rem;
            color: rgba(255,255,255,0.9);
        }

        .vault-stat {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 14px;
            background: rgba(255,255,255,0.14);
            border: 1px solid rgba(255,255,255,0.18);
            border-radius: 999px;
            backdrop-filter: blur(12px);
            width: fit-content;
        }

        .vault-stat-label {
            opacity: 0.9;
            font-weight: 500;
        }

        .vault-stat-value {
            font-weight: 700;
            color: rgba(255,255,255,1);
            font-size: 1.08em;
        }

        .search-box {
            background: rgba(255, 255, 255, 0.94);
            border: 1px solid var(--panel-border);
            border-radius: var(--radius);
            box-shadow: var(--shadow-sm);
            margin-bottom: 22px;
            padding: 24px;
        }

        .search-box form {
            display: flex;
            gap: 12px;
        }

        .search-box input[type="text"] {
            background: #f8fafc;
            border: 1px solid #dbe3ef;
            border-radius: 999px;
            flex: 1;
            outline: none;
            padding: 15px 20px;
            font-size: 1rem;
            transition: border-color 0.2s, box-shadow 0.2s, background 0.2s;
        }

        .search-box input[type="text"]:focus {
            background: white;
            border-color: var(--primary);
            box-shadow: 0 0 0 4px rgba(91, 110, 225, 0.14);
        }

        .search-box button {
            background: linear-gradient(135deg, var(--primary) 0%, var(--accent) 100%);
            border: none;
            border-radius: 999px;
            box-shadow: 0 12px 24px rgba(91, 110, 225, 0.26);
            color: white;
            cursor: pointer;
            font-size: 1rem;
            font-weight: 700;
            padding: 15px 28px;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .search-box button:hover {
            transform: translateY(-2px);
            box-shadow: 0 16px 30px rgba(91, 110, 225, 0.34);
        }

        .result-card {
            background: rgba(255, 255, 255, 0.96);
            border: 1px solid var(--panel-border);
            border-radius: 14px;
            box-shadow: var(--shadow-sm);
            margin-bottom: 14px;
            padding: 20px;
            transition: box-shadow 0.2s, transform 0.2s;
        }

        .result-card:hover {
            box-shadow: 0 14px 32px rgba(15, 23, 42, 0.10);
            transform: translateY(-1px);
        }

        .result-card .title {
            color: #3730a3;
            font-size: 1.1rem;
            font-weight: 700;
            margin-bottom: 5px;
        }

        .result-card .path {
            color: #006621;
            font-size: 0.85rem;
            margin-bottom: 8px;
            word-break: break-all;
        }

        .result-card .snippet {
            color: #475569;
            font-size: 0.95rem;
        }

        .result-card .score {
            display: inline-block;
            background: #eef2ff;
            color: #4338ca;
            padding: 4px 10px;
            border-radius: 999px;
            font-size: 0.8rem;
            font-weight: 700;
            margin-top: 10px;
        }

        .chat-container {
            background: var(--panel);
            border: 1px solid var(--panel-border);
            border-radius: var(--radius);
            box-shadow: var(--shadow-sm);
            overflow: hidden;
        }

        .chat-messages {
            min-height: 400px;
            max-height: 500px;
            overflow-y: auto;
            padding: 20px;
        }

        .message {
            margin-bottom: 20px;
            display: flex;
            gap: 15px;
        }

        .message.user {
            flex-direction: row-reverse;
        }

        .message .avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            flex-shrink: 0;
        }

        .message.user .avatar {
            background: #667eea;
            color: white;
        }

        .message.assistant .avatar {
            background: #34a853;
            color: white;
        }

        .message .content {
            background: #f1f3f4;
            padding: 12px 18px;
            border-radius: 18px;
            max-width: 70%;
        }

        .message.user .content {
            background: #667eea;
            color: white;
        }

        .chat-input {
            border-top: 1px solid #eee;
            padding: 20px;
        }

        .chat-input form {
            display: flex;
            gap: 10px;
        }

        .chat-input input[type="text"] {
            flex: 1;
            padding: 12px 18px;
            font-size: 1rem;
            border: 2px solid #ddd;
            border-radius: 25px;
            outline: none;
        }

        .chat-input input[type="text"]:focus {
            border-color: #667eea;
        }

        .chat-input button {
            padding: 12px 25px;
            font-size: 1rem;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 25px;
            cursor: pointer;
        }

        .no-results, .error {
            text-align: center;
            padding: 40px;
            color: #666;
        }

        .error {
            color: #d93025;
            background: #fce8e6;
            border-radius: 8px;
        }

        .welcome {
            text-align: center;
            padding: 38px 0 20px;
        }

        .welcome h2 {
            font-size: 2rem;
            margin-bottom: 15px;
            color: #333;
        }

        .welcome p {
            color: var(--muted);
            font-size: 1.1rem;
            margin-bottom: 30px;
        }

        .mode-cards {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
            margin-top: 30px;
        }

        .mode-card {
            background: rgba(255, 255, 255, 0.95);
            border: 1px solid var(--panel-border);
            border-radius: var(--radius);
            box-shadow: var(--shadow-sm);
            color: inherit;
            min-height: 220px;
            padding: 28px;
            text-decoration: none;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .mode-card:hover {
            transform: translateY(-5px);
            box-shadow: var(--shadow-md);
        }

        .mode-card .icon {
            align-items: center;
            background: linear-gradient(135deg, rgba(91, 110, 225, 0.12), rgba(139, 92, 246, 0.16));
            border-radius: 16px;
            color: #4f46e5;
            display: inline-flex;
            font-size: 2rem;
            height: 58px;
            justify-content: center;
            margin-bottom: 18px;
            width: 58px;
        }

        .mode-card h3 {
            font-size: 1.3rem;
            margin-bottom: 10px;
        }

        .mode-card p {
            color: var(--muted);
            font-size: 0.95rem;
        }

        .mode-card .example {
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 10px;
            color: #475569;
            display: block;
            font-size: 0.85rem;
            margin-top: 14px;
            padding: 10px 12px;
        }

        .empty-chat {
            text-align: center;
            color: #999;
            padding: 100px 20px;
        }

        .empty-chat .icon {
            font-size: 4rem;
            margin-bottom: 20px;
        }

        /* Markdown content styles */
        .markdown-content {
            line-height: 1.7;
        }

        .markdown-content p {
            margin-bottom: 12px;
        }

        .markdown-content p:last-child {
            margin-bottom: 0;
        }

        .markdown-content h1, .markdown-content h2, .markdown-content h3,
        .markdown-content h4, .markdown-content h5, .markdown-content h6 {
            margin-top: 16px;
            margin-bottom: 8px;
            font-weight: 600;
        }

        .markdown-content h1 { font-size: 1.4em; }
        .markdown-content h2 { font-size: 1.25em; }
        .markdown-content h3 { font-size: 1.1em; }

        .markdown-content ul, .markdown-content ol {
            margin: 8px 0;
            padding-left: 24px;
        }

        .markdown-content li {
            margin-bottom: 4px;
        }

        .markdown-content code {
            background: rgba(0, 0, 0, 0.1);
            padding: 2px 6px;
            border-radius: 4px;
            font-family: 'SF Mono', Monaco, 'Courier New', monospace;
            font-size: 0.9em;
        }

        .markdown-content pre {
            background: #2d2d2d;
            color: #f8f8f2;
            padding: 12px 16px;
            border-radius: 8px;
            overflow-x: auto;
            margin: 12px 0;
        }

        .markdown-content pre code {
            background: none;
            padding: 0;
            color: inherit;
        }

        .markdown-content blockquote {
            border-left: 4px solid #667eea;
            padding-left: 16px;
            margin: 12px 0;
            color: #555;
            font-style: italic;
        }

        .markdown-content a {
            color: #667eea;
            text-decoration: none;
        }

        .markdown-content a:hover {
            text-decoration: underline;
        }

        @media (max-width: 820px) {
            header .container {
                grid-template-columns: 1fr;
            }

            header nav {
                border-radius: 18px;
                flex-wrap: wrap;
                justify-content: center;
                width: 100%;
            }

            header nav a {
                flex: 1 1 auto;
                text-align: center;
            }

            .search-box form,
            .chat-input form {
                flex-direction: column;
            }

            .search-box button {
                width: 100%;
            }
        }

        .markdown-content table {
            border-collapse: collapse;
            width: 100%;
            margin: 12px 0;
        }

        .markdown-content th, .markdown-content td {
            border: 1px solid #ddd;
            padding: 8px 12px;
            text-align: left;
        }

        .markdown-content th {
            background: #f5f5f5;
            font-weight: 600;
        }

        .markdown-content hr {
            border: none;
            border-top: 1px solid #ddd;
            margin: 16px 0;
        }

        mark {
            background: #fef08a;
            border-radius: 3px;
            padding: 0 2px;
        }
    </style>
    <link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>
<body>
    <header>
        <div class="container">
            <div>
                <div class="header-brand">
                    <img src="/static/favicon.svg" alt="Talkpipe Vault" class="header-logo">
                    <div>
                        <h1>Talkpipe Vault</h1>
                        <p class="header-subtitle">Search, read, and ask questions across your indexed documents.</p>
                    </div>
                </div>
                <div class="vault-stats">
                    <div class="vault-stat">
                        <span class="vault-stat-label">Chunks:</span>
                        <span class="vault-stat-value">{{ shingled_chunks_count|default(0)|int }}</span>
                    </div>
                </div>
            </div>
            <nav>
                <a href="/" {% if request.url.path == '/' %}class="active"{% endif %}>Home</a>
                <a href="/search" {% if request.url.path == '/search' %}class="active"{% endif %}>Semantic Search</a>
                <a href="/keyword-search" {% if request.url.path == '/keyword-search' %}class="active"{% endif %}>Keyword Search</a>
                <a href="/chat" {% if request.url.path == '/chat' %}class="active"{% endif %}>Ask</a>
                <form method="post" action="/refresh">
                    <input type="hidden" name="return_to" value="{{ request.url.path }}">
                    <button type="submit" title="Refresh vault connections and counts">Refresh</button>
                </form>
            </nav>
        </div>
    </header>

    <div class="{% block container_class %}container{% endblock %}">
        {% block content %}{% endblock %}
    </div>
</body>
</html>
