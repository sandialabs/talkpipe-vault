[build-system]
requires = ["setuptools", "setuptools_scm"]
build-backend = "setuptools.build_meta"

[project]
name = "talkpipe-vault"
authors = [
    {name = "Travis Bauer", email = "tlbauer@sandia.gov"},
]
maintainers = [
    {name = "Travis Bauer", email = "tlbauer@sandia.gov"}
]
description = "AI-powered personal information assistant"
readme = "README.md"
requires-python = ">=3.11.4"
keywords = ["ai"]
license = "Apache-2.0"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
    "Topic :: Text Processing",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "talkpipe[all]>=0.11.7a1",
    "fastapi[standard]>=0.104.1",
    "uvicorn>=0.24.0",
    "jinja2>=3.1.2",
    "watchdog[watchmedo]"
]
dynamic = ["version"]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-mock>=3.10.0",
    "pytest-cov>=4.0.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.24.0",  # For testing FastAPI endpoints
    "black>=23.0.0",
    "isort>=5.12.0",
    "flake8>=6.0.0",
    "mypy>=1.0.0",
    "bandit>=1.7.0",
    "safety>=2.3.0",
]
test = [
    "pytest>=7.0.0",
    "pytest-mock>=3.10.0",
    "pytest-cov>=4.0.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.24.0",
]
security = [
    "bandit>=1.7.0",
    "safety>=2.3.0",
]

[project.urls]
Homepage = "https://github.com/sandialabs/talkpipe-vault"
Repository = "https://github.com/sandialabs/talkpipe-vault"
Documentation = "https://github.com/sandialabs/talkpipe-vault#readme"
"Bug Tracker" = "https://github.com/sandialabs/talkpipe-vault/issues"

[project.scripts]
vault-monitor = "vault.document_monitor.cli:main"
vault-watch-into-vectordb = "talkpipe_vault.pipelines.cli:watch_vectordb_main"
vault-list-into-vectordb = "talkpipe_vault.pipelines.cli:list_vectordb_main"
vault-query = "talkpipe_vault.apps.query:main"
vault-server = "talkpipe_vault.apps.vault_server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"*" = ["*.html", "*.css", "*.js", "*.json"]
"vault.app" = ["templates/**/*", "static/**/*"]
"talkpipe_vault.apps" = ["templates/**/*"]

[tool.setuptools_scm]
# Use defaults

[tool.coverage.run]
source = ["src/vault"]
omit = [
    "*/tests/*",
    "*/test_*.py",
    "*/__pycache__/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if settings.DEBUG",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]

[tool.black]
line-length = 88
target-version = ['py311']
include = '\\.pyi?$'
extend-exclude = '''
/(
  # directories
  \\.eggs
  | \\.git
  | \\.hg
  | \\.mypy_cache
  | \\.tox
  | \\.venv
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"
multi_line_output = 3
line_length = 88
known_first_party = ["vault"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true
show_error_codes = true

[[tool.mypy.overrides]]
module = [
    "talkpipe.*",
    "uvicorn.*",
    "watchdog.*",
]
ignore_missing_imports = true

[tool.bandit]
exclude_dirs = ["tests"]
#skips = ["B101", "B601"]

[tool.bandit.assert_used]
skips = ["*/test_*.py", "*/conftest.py"]

[project.entry-points."talkpipe.plugins"]
talkpipe_vault = "talkpipe_vault.initialize_plugin"

[project.entry-points."talkpipe.sources"]
fileWatcher = "talkpipe_vault.watchdog:file_watcher"
watchIntoVectorDB = "talkpipe_vault.pipelines.building_and_watching:watch_into_vector_db"
listIntoVectorDB = "talkpipe_vault.pipelines.building_and_watching:list_into_vector_db"

[project.entry-points."talkpipe.segments"]
buildVectorDBFromPaths = "talkpipe_vault.pipelines.building_and_watching:build_vector_db_from_paths"
vaultChat = "talkpipe_vault.pipelines.searching_and_prompting:VaultChat"
vaultSearch = "talkpipe_vault.pipelines.searching_and_prompting:VaultSearch"
vaultTextSearch = "talkpipe_vault.pipelines.searching_and_prompting:VaultTextSearch"
