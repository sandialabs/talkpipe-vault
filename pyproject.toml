[build-system]
requires = ["setuptools", "setuptools_scm"]
build-backend = "setuptools.build_meta"

[project]
name = "talkpipe-vault"
authors = [
    {name = "Travis Bauer", email = "tlbauer@sandia.gov"},
]
maintainers = [
    {name = "Travis Bauer", email = "tlbauer@sandia.gov"}
]
description = "AI-powered personal information assistant"
readme = "README.md"
requires-python = ">=3.11.4"
keywords = ["ai"]
license = "Apache-2.0"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent",
    "Topic :: Text Processing",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
# Some lower bounds below are security floors rather than feature
# requirements: the lowest release of that package with no known
# vulnerability, as reported by `safety`. Left lower, a resolver is free to
# pick a known-vulnerable old release, which is what the scan flags. Every
# floor is at or below the version currently resolved, so raising them does
# not change what actually installs -- raise a floor when a new advisory
# lands, do not lower one.
dependencies = [
    "talkpipe[all]>=0.14.1",  # stable floor; build_rag_database landed in 0.13.0b3
    "fastapi[standard]>=0.109.1",  # security floor
    "uvicorn>=0.24.0",
    "jinja2>=3.1.6",  # security floor
    "watchdog[watchmedo]"
]
dynamic = ["version"]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.3",
    "pytest-mock>=3.10.0",
    "pytest-cov>=4.0.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.24.0",  # For testing FastAPI endpoints
    # Lint/type tools are pinned to a minor series on purpose: ruff promotes
    # new rules and mypy adds checks in minor releases, and CI resolves fresh,
    # so an open floor would turn a tool release into a red build. Bump the
    # pins deliberately (and the ruff-pre-commit rev with them).
    "ruff>=0.16.3,<0.17",
    "mypy>=2.3,<3",
    "pre-commit>=4.0",
    "bandit>=1.7.7",
    "safety>=2.3.0",
]
test = [
    "pytest>=9.0.3",
    "pytest-mock>=3.10.0",
    "pytest-cov>=4.0.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.24.0",
]
security = [
    "bandit>=1.7.7",
    "safety>=2.3.0",
]

[project.urls]
Homepage = "https://github.com/sandialabs/talkpipe-vault"
Repository = "https://github.com/sandialabs/talkpipe-vault"
Documentation = "https://github.com/sandialabs/talkpipe-vault#readme"
"Bug Tracker" = "https://github.com/sandialabs/talkpipe-vault/issues"

[project.scripts]
vault-server = "talkpipe_vault.apps.vault_server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"*" = ["*.html", "*.css", "*.js", "*.json"]
"talkpipe_vault.apps" = ["templates/**/*", "static/**/*"]

[tool.setuptools_scm]
# Use defaults

[tool.coverage.run]
source = ["src/talkpipe_vault"]
omit = [
    "*/tests/*",
    "*/test_*.py",
    "*/__pycache__/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if settings.DEBUG",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]

[tool.ruff]
line-length = 88
target-version = "py311"
src = ["src", "tests"]
extend-exclude = ["build", "dist", ".venv"]

[tool.ruff.lint]
# An explicit select rather than ruff's (version-dependent) defaults, so a
# ruff upgrade never silently changes what CI enforces. CI fails on any
# finding; there is no advisory pass.
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort
    "UP",       # pyupgrade
    "B",        # bugbear
    "C4",       # comprehensions
    "SIM",      # simplify
    "PIE", "RUF", "PERF", "RET", "ISC", "FLY",
    "PT",       # pytest style
    "T10",      # debugger left in
    "LOG", "G", # logging
    "PGH",      # blanket noqa / type: ignore
    "PLE",      # pylint errors only
]
ignore = [
    "E501",   # line length: ruff format governs code; long strings/docstrings stay
    "ISC001", # conflicts with the formatter
    "G004",   # f-strings in logging calls are accepted style here
]

[tool.ruff.lint.per-file-ignores]
# pytest-style rules only make sense in the test suite (an application
# function that happens to be named test_* is not a test).
"src/**" = ["PT"]
# Tests assert on exception *types* deliberately; requiring a message match
# on every `pytest.raises` adds noise without catching bugs.
"tests/**" = ["PT011"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's dependency-injection markers are the documented way to declare
# parameters; they are not the mutable-default trap B008 exists to catch.
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.Query",
    "fastapi.Header",
    "fastapi.Body",
    "fastapi.Path",
    "fastapi.Form",
    "fastapi.File",
    "fastapi.Cookie",
]

[tool.ruff.lint.isort]
known-first-party = ["talkpipe_vault"]

[tool.ruff.format]
docstring-code-format = true

[tool.mypy]
# 3.12+ so mypy can parse modern dependency stubs (e.g. numpy uses `type`
# statements); the package itself still supports Python 3.11.
python_version = "3.12"
files = ["src"]
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
# talkpipe ships no py.typed marker yet, so its @segment/@register_segment
# decorators are untyped and would fail every pipeline definition here.
# Re-enable once talkpipe is typed.
disallow_untyped_decorators = false
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true
show_error_codes = true
enable_error_code = ["ignore-without-code"]

[[tool.mypy.overrides]]
module = [
    "parsy.*",
    "talkpipe.*",
    "uvicorn.*",
    "watchdog.*",
]
ignore_missing_imports = true

[tool.bandit]
exclude_dirs = ["tests"]
#skips = ["B101", "B601"]

[tool.bandit.assert_used]
skips = ["*/test_*.py", "*/conftest.py"]

[project.entry-points."talkpipe.plugins"]
talkpipe_vault = "talkpipe_vault.initialize_plugin"

[project.entry-points."talkpipe.sources"]
fileWatcher = "talkpipe_vault.watchdog:file_watcher"
watchIntoVectorDB = "talkpipe_vault.pipelines.building_and_watching:watch_into_vector_db"
listIntoVectorDB = "talkpipe_vault.pipelines.building_and_watching:list_into_vector_db"

[project.entry-points."talkpipe.segments"]
buildVectorDBFromPaths = "talkpipe_vault.pipelines.building_and_watching:build_vector_db_from_paths"
extractSearchKeywords = "talkpipe_vault.pipelines.searching_and_prompting:ExtractSearchKeywords"
filterSearchResults = "talkpipe_vault.pipelines.searching_and_prompting:SearchResultFilter"
mergeSearchResults = "talkpipe_vault.pipelines.searching_and_prompting:MergeSearchResults"
searchLance = "talkpipe_vault.pipelines.searching_and_prompting:searchLance"
vaultChat = "talkpipe_vault.pipelines.searching_and_prompting:VaultChat"
vaultSearch = "talkpipe_vault.pipelines.searching_and_prompting:VaultSearch"
vaultTextSearch = "talkpipe_vault.pipelines.searching_and_prompting:VaultTextSearch"
